# =====================================================================
# postgresql.conf — commun au serveur principal et au serveur de reprise
# Seuls les paramètres qui diffèrent des valeurs par défaut sont listés.
# =====================================================================

# --- Connexions ---
listen_addresses = '*'
max_connections = 100
password_encryption = 'scram-sha-256'

# --- Réplication (streaming) ---
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
max_slot_wal_keep_size = '2GB'   # garde-fou : un réplica arrêté longtemps ne remplit pas le disque
hot_standby = on                 # le réplica accepte les lectures
hot_standby_feedback = on
wal_log_hints = on               # permet pg_rewind lors d'un retour à la normale
wal_keep_size = '256MB'

# --- Archivage continu vers pgBackRest (restauration à un instant précis) ---
archive_mode = on
archive_command = 'pgbackrest --stanza=residence archive-push %p'
archive_timeout = 300            # au plus 5 min de WAL non archivés (RPO sauvegarde)
restore_command = 'pgbackrest --stanza=residence archive-get %f "%p"'

# --- Durabilité ---
# Réplication asynchrone : l'application ne ralentit pas si le réplica tombe.
# Pour zéro perte en cas de bascule, voir « Réplication synchrone » dans README.md.
synchronous_commit = on

# --- Journalisation ---
log_timezone = 'America/Toronto'
timezone = 'America/Toronto'
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = on
log_disconnections = on
log_min_duration_statement = 500   # requêtes lentes (> 500 ms)
log_statement = 'ddl'              # changements de schéma tracés ; jamais 'all' (données personnelles)

# --- Divers ---
shared_preload_libraries = 'pg_stat_statements'
