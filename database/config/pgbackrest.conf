# =====================================================================
# pgbackrest.conf — sauvegardes chiffrées + archives WAL
# En local, le dépôt est un volume Docker partagé par les deux serveurs.
# En production : dépôt sur stockage objet au Canada (voir README.md, repo1-type=s3).
# Le mot de passe de chiffrement vient de la variable
# PGBACKREST_REPO1_CIPHER_PASS (jamais écrit dans ce fichier).
# =====================================================================

[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
# 4 sauvegardes complètes (≈ 4 semaines) et leurs WAL sont conservées
# (pgBackRest n'accepte pas les commentaires en fin de ligne)
repo1-retention-full=4
repo1-retention-diff=6
compress-type=zst
process-max=2
start-fast=y
archive-async=n
log-level-console=info
log-level-file=off

[residence]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-port=5432
