<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <!-- viewport-fit=cover : la barre du bas tient compte de la barre d'accueil de l'iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Thème choisi dans « Mon profil » (src/lib/theme.ts), posé avant le premier affichage -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.dataset.theme = t === 'dark' || t === 'system' ? t : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Journal" />
    <title>Journal de bord</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
